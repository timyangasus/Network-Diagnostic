<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#57B7FF">
<title>Network Diagnostic</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --tx:#283745;--t2:#5F6B76;--t3:#929292;--bd:#E6E9EC;
  --blue:#4A8FE0;--ok:#65C4B9;--warn:#FF9643;--fail:#D95B47;
  --f:'DM Sans',-apple-system,'PingFang TC','Noto Sans TC',sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:#D8DCE8;font-family:var(--f);color:var(--tx)}
body{display:flex;align-items:center;justify-content:center}
.phone{width:393px;height:852px;max-height:100%;background:#fff;overflow:hidden;position:relative;flex-shrink:0}
@media (max-width:430px){.phone{width:100%;height:100dvh;max-height:none}}
.page{display:none;position:absolute;inset:0;flex-direction:column;background:#fff}
.page.on{display:flex}
.ov{display:none;position:absolute;inset:0;z-index:20;background:rgba(12,17,32,.5);align-items:flex-end}
.ov.on{display:flex}
.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;padding:20px 20px 40px;max-height:88%;overflow-y:auto}
.hdl{width:36px;height:4px;background:#CDD3E8;border-radius:2px;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}

/* list / traffic pages */
.navbar{display:flex;align-items:center;justify-content:center;position:relative;height:56px;flex-shrink:0;padding-top:6px}
.navbar .ttl{font-size:15px;font-weight:500;color:var(--blue)}
.navbar .bk{position:absolute;left:18px;top:12px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;cursor:pointer}
.listrow{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:58px;border-bottom:1px solid var(--bd);font-size:16px;cursor:pointer}
.listrow:first-of-type{border-top:1px solid var(--bd)}

/* diagnostic hero */
#hero{flex-shrink:0;position:relative;padding:0 0 74px;transition:background .5s}
.hnav{display:flex;align-items:center;justify-content:center;position:relative;height:44px;margin-top:18px}
.hnav .bk{position:absolute;left:12px;top:4px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hnav .t{font-size:16px;font-weight:600;color:#fff}
.hrow{display:flex;align-items:center;gap:15px;padding:20px 28px 0 36px}
#hicon{width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.13);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#htitle{font-size:21px;font-weight:500;color:#fff;line-height:1.25}
#hsub{font-size:11.5px;color:rgba(255,255,255,.95);line-height:1.45;margin-top:3px}
#hbtn{display:flex;align-items:center;justify-content:center;width:160px;height:44px;margin:24px auto 0;background:#fff;border-radius:22px;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--tx);transition:opacity .2s}

/* steps */
.sec{font-size:14px;color:var(--tx);padding:0 30px;margin-top:-34px;position:relative;z-index:1;height:20px;cursor:pointer}
#steps{padding-top:18px;overflow-y:auto;flex:1;min-height:0}
.row{position:relative;display:flex;gap:14px;padding:14px 31px 14px 30px}
.row .line{position:absolute;left:44px;top:44px;bottom:-14px;width:1.5px;background:#E3E7EA;z-index:0}
.row .ic{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:#F0F3F6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .main{flex:1;min-width:0}
.row .top{height:30px;display:flex;align-items:center;justify-content:space-between}
.row .lbl{font-size:16px;font-weight:500;color:var(--tx)}
.row .desc{font-size:11px;color:var(--t3);margin-top:-3px;line-height:1.5}
.row .box{margin:7px 26px 0 0;background:#FCF0EE;border:1px solid var(--fail);border-radius:8px;padding:9px 12px}
.row .box b{display:block;font-size:12px;color:var(--fail);margin-bottom:3px}
.row .box.warn{background:#FFF6EA;border-color:#FF9643}
.row .box.warn b{color:#E8821F}
.row .box .part+.part{margin-top:8px;padding-top:8px;border-top:1px solid rgba(217,91,71,.3)}
.row .box span{font-size:11px;color:#7C7C7C;line-height:1.5;display:block}
.sb{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dash{font-size:14px;color:#8B939A;letter-spacing:2px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid #D9DDE1;border-top-color:#7A828A;animation:spin .7s linear infinite}

/* home-style entry page (網路流量頁) */
.hhead{display:flex;align-items:center;justify-content:space-between;height:56px;padding:6px 16px 0;flex-shrink:0}
.hhead .g{width:34px;height:34px;border-radius:50%;background:#EEEEEE;display:flex;align-items:center;justify-content:center}
.hhead{position:relative}
.hhead .ht{font-size:17px;font-weight:700;color:#4DA3FF;position:absolute;left:0;right:0;top:20px;text-align:center;pointer-events:none}
.bk2{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hcard{display:flex;align-items:center;margin:8px 18px 0;background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(80,140,255,.28);padding:12px 14px;flex-shrink:0}
.hcard .th{width:86px;text-align:center;font-size:11px;color:#2B6CF0;flex-shrink:0}
.hcard .info{flex:1;padding-left:10px;font-size:12px;color:#777;line-height:1.55}
.hcard .info b{display:block;font-weight:500;color:#2B6CF0}
.hcard .sp{width:1px;align-self:stretch;background:#C9D8F5;margin:0 14px}
.welcome{text-align:center;color:#4DA3FF;font-size:29px;font-weight:300;margin-top:34px}
.model{text-align:center;color:#4DA3FF;font-size:22px;font-weight:400;margin-top:20px}
.rt{width:114px;height:103px;margin:56px auto 0;border-radius:10px;background:linear-gradient(90deg,#E9EAEC 0,#FAFAFB 7%,#fff 50%,#FAFAFB 93%,#E6E7E9 100%);box-shadow:0 18px 22px -14px rgba(0,0,0,.28),inset 0 -10px 0 #F1F1F2;position:relative}
.rt::after{content:'ASUS';position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:7px;letter-spacing:.8px;color:#C9B27A;font-weight:700}
.dots{display:flex;gap:9px;justify-content:center;margin-top:26px}
.dots i{width:9px;height:9px;border-radius:50%;background:#BCD6F6}
.dots i:first-child{background:#2B7DE9}
.qa{display:flex;justify-content:space-around;padding:20px 40px 16px}
.abar{display:flex;align-items:center;gap:10px;height:62px;background:#F0902D;color:#fff;padding:0 16px;flex-shrink:0}
.abar .tx{flex:1;font-size:14.5px}
.abar .bt{border:1.5px solid #fff;border-radius:16px;height:32px;padding:0 16px;display:flex;align-items:center;font-size:13.5px;font-weight:500;cursor:pointer}
.tabbar{display:flex;height:74px;background:#fff;border-top:1px solid #ECECEC;padding:8px 6px 0;flex-shrink:0}
.tabbar .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#7B7F85;position:relative;cursor:default}
.tabbar .t.on{color:#2B7DE9}
.tabbar .t.go{cursor:pointer}
.tabbar .bd{position:absolute;top:-3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:#2B7DE9;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="phone">

  <!-- 診斷 list -->

    <div class="navbar"><div class="bk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A8FE0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div><div class="ttl">診斷</div></div>

    <div class="listrow" onclick="gotoPage('pg-traffic')"><span>網路連線異常</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B5BBC1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>

      <div class="g"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-2.8-.4-4.1H24v7.7h12c-.2 1.9-1.6 4.8-4.6 6.7l7 5.4c4.2-3.9 6.6-9.6 6.6-15.7z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.7-5.4l-7-5.4c-1.9 1.3-4.4 2.2-7.7 2.2-5.9 0-10.9-3.9-12.7-9.3l-7.2 5.6C7.7 40.9 15.2 46 24 46z"/><path fill="#FBBC05" d="M11.3 28.1c-.5-1.3-.7-2.7-.7-4.1s.3-2.8.7-4.1l-7.2-5.6C2.7 17.1 2 20.4 2 24s.7 6.9 2.100 9.700z"/><path fill="#EA4335" d="M24 10.600c4.100 0 6.900 1.800 8.500 3.300l6.200-6C35 4.400 30 2 24 2 15.200 2 7.700 7.100 4.100 14.300l7.200 5.600c1.800-5.400 6.800-9.300 12.700-9.300z"/></svg></div></div>
      <div class="ht">Home</div>
      <div style="display:flex;align-items:center;gap:14px;color:#4DA3FF">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.500h.01" stroke-width="2.200"/></svg>
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.700 21a2 2 0 01-3.400 0"/></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
      </div>
    </div>
    <div class="hcard">
      <div class="th"><div style="width:30px;height:34px;margin:0 auto 6px;border-radius:5px;background:linear-gradient(90deg,#E6E7E9,#fff 50%,#E6E7E9)"></div>ZenWiFi XT9</div>
      <div class="info">LAN IP <span style="color:#2B6CF0">»</span><b>192.168.50.1</b>Network Name<b>timmmxt9</b></div>
      <div class="sp"></div>
      <svg width="62" height="46" viewBox="0 0 62 46" fill="none" stroke="#9AA9B4" stroke-width="3.600" stroke-linecap="round"><path d="M5 40a26 26 0 1152 0"/><path d="M31 38l12-14" stroke-width="4"/><circle cx="31" cy="38" r="3" fill="#9AA9B4"/></svg>
    </div>
    <div class="welcome">Welcome</div>
    <div class="model">ZenWiFi XT9</div>
    <div class="rt"></div>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
    <div class="qa" style="flex:1;align-items:flex-end">
      <svg width="54" height="54" viewBox="0 0 54 54" fill="none"><circle cx="27" cy="27" r="25" fill="#2B7DE9"/><g stroke="#fff" stroke-width="1.800"><circle cx="27" cy="27" r="14"/><ellipse cx="27" cy="27" rx="6" ry="14"/><path d="M13 27h28M15.500 20h23M15.500 34h23"/></g></svg>
      <svg width="54" height="54" viewBox="0 0 54 54" fill="none"><circle cx="27" cy="27" r="24" fill="#fff" stroke="#6FA8EE" stroke-width="3"/><path d="M15 31l12-10 12 10v8H15z" fill="#6FA8EE"/><path d="M19 22a12 12 0 0116 0M22 18a8 8 0 0110 0" stroke="#6FA8EE" stroke-width="2.400" stroke-linecap="round"/></svg>
      <svg width="54" height="54" viewBox="0 0 54 54" fill="none"><circle cx="27" cy="27" r="24" fill="#fff" stroke="#9CC4F5" stroke-width="3"/><path d="M15 24a17 17 0 0124 0M19 29a11 11 0 0116 0M23 34a5 5 0 018 0" stroke="#9CC4F5" stroke-width="2.800" stroke-linecap="round"/><circle cx="27" cy="38.500" r="1.800" fill="#9CC4F5"/></svg>
    </div>

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.500h.01" stroke-width="2.200"/></svg>
      <div class="tx">網路連線可能異常</div>
      <div class="bt" onclick="openDiag('traffic',true)">詳細診斷</div>
    </div>
    <div class="tabbar">
      <div class="t on"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M10 21v-7h4v7"/></svg><span>Home</span></div>

      <div class="t"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20a6 6 0 0112 0M10 20a6 6 0 0112 0"/></svg><span>Family</span></div>

    </div>

  <!-- Network Diagnostic -->
  <div class="page" id="pg-diag">
    <div id="hero">
      <div class="hnav"><div class="bk" onclick="backFromDiag()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div><div class="t">Network Diagnostic</div></div>
      <div class="hrow"><div id="hicon"></div><div><div id="htitle"></div><div id="hsub"></div></div></div>

    <!-- hidden demo picker: tap 連線檢查 -->

        <div class="hdl"></div>
        <div style="font-size:18px;font-weight:600;text-align:center;margin-bottom:4px">切換診斷情境</div>

        <div class="listrow" style="padding:0 4px;gap:12px;justify-content:flex-start" onclick="hide('ov-demo');demoJump('mixed')"><div class="sb" style="background:linear-gradient(135deg,#FF9643 50%,#D95B47 50%)"></div><span style="font-weight:600">錯誤＋不穩</span></div>

        <div class="listrow" style="padding:0 4px;gap:12px;justify-content:flex-start" onclick="hide('ov-demo');demoJump('warndns')"><div class="sb" style="background:linear-gradient(135deg,#FF9643 50%,#D95B47 50%)"></div><span style="font-weight:600">Ping 不穩＋DNS 異常</span></div>
        <div class="listrow" style="padding:0 4px;gap:12px;justify-content:flex-start;border-bottom:none" onclick="hide('ov-demo');demoJump('faildns')"><div class="sb" style="background:linear-gradient(135deg,#D95B47 50%,#A93D2E 50%)"></div><span style="font-weight:600">Ping 異常＋DNS 異常</span></div></div>
    </div>
  </div>

</div>

<script>
function g(id){return document.getElementById(id)}
function show(id){g(id).classList.add('on')}
function hide(id){g(id).classList.remove('on')}
function gotoPage(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on')});show(id)}

var STEPS=[
  {key:'device',   label:'您的裝置',    icon:'<rect x="2.5" y="5" width="13" height="9" rx="1.5"/><path d="M1 17h16"/><rect x="15.5" y="8" width="6" height="10" rx="1.4"/>'},
  {key:'router',   label:'華碩路由器',  icon:'<rect x="3" y="13" width="18" height="6" rx="2"/><path d="M7 16h.01M11 16h.01"/><path d="M8 13V9M16 13V9"/><path d="M9.5 6.5a3.5 3.5 0 015 0"/>'},
  {key:'upstream', label:'上游網路設備',icon:'<rect x="9" y="7" width="6" height="12" rx="1.5"/><path d="M12 16h.01"/><path d="M6.5 9.5a4 4 0 000 5M17.5 9.5a4 4 0 010 5M4 7.5a7.5 7.5 0 000 9M20 7.5a7.5 7.5 0 010 9"/>'},
  {key:'internet', label:'網際網路',    icon:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>'},
];
/* copy per ASUS-WL/Documentations#2538 — DNS is folded into Router / Gateway / Internet (Client = ping only) */
var PING_FAIL={
  device:  {title:'Wi‑Fi 已關閉。',                  lines:['請啟用您行動裝置的 Wi‑Fi。']},
  router:  {title:'華碩路由器似乎是離線狀態。',        lines:['請確認華碩路由器是電源開啟的狀態。','請檢查是否訊號太遠或干擾。','請重開路由器後再試一次。']},
  upstream:{title:'上游網路設備似乎是離線狀態。',      lines:['請確認您的上游網路設備是開啟的狀態。','請重新插拔線路，並確認所有的線路都有正確連接。','請嘗試重啟上游網路設備。','請與您的網路服務供應商聯繫，以修正網路連線問題。']},
  internet:{title:'您的網路服務供應商似乎出了點問題。',  lines:['請與您的網路服務供應商聯繫，以修正網路連線問題。']}
};
var DNS_FAIL={
  router:  {title:'路由器無法解析網站名稱。',          lines:['請重新啟動華碩路由器後再試一次。','若問題持續，請檢查路由器的 DNS 設定，或變更其他 DNS 服務。']},
  upstream:{title:'網路服務供應商的 DNS 服務可能異常。', lines:['請嘗試重啟您的上游網路設備。','您可以嘗試在華碩路由器中改用其他 DNS 服務。','若問題持續，請聯絡您的網路服務供應商。']},
  internet:{title:'網域名稱解析異常。',               lines:['部分網站暫時無法使用，請稍後再試。若問題持續，請聯絡網路服務供應商。']}
};
var WARN_DESC='偵測到此段連線偶有中斷，可能影響上網穩定性。';
var WARN_COPY={title:'此段連線不穩定。',lines:[WARN_DESC]};
var COLOR={ok:'#65C4B9',warn:'#FF9643',fail:'#D95B47'};
var THEME={ /* c: top / body / light fade colours, btn: button text colour */
  idle:   {c:['#57B7FF','#5EC5FF','#CDF1FF'],btn:'#283745'},
  running:{c:['#57B7FF','#5EC5FF','#CDF1FF'],btn:'#283745'},
  success:{c:['#40B9AF','#38AEA1','#D1F2EC'],btn:'#1E9D90'},
  warn:   {c:['#F6AB63','#EE9F55','#FAECDA'],btn:'#BC6F10'},
  fail:   {c:['#E47867','#E26B5A','#FCE1DB'],btn:'#D95B47'}
};
var ICON={
  search:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>',
  ok:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  warn:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="14"/><line x1="12" y1="18.6" x2="12.01" y2="18.6" stroke-width="4.2"/></svg>',
  fail:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>'
};
/* per-layer result: ok | warn(ping partly failed) | fail(ping all failed) | dns(ping ok, DNS failed)
   | warndns(ping partly failed + DNS failed) | faildns(ping + DNS failed). Anything but ok/warn is ❌ and stops the run. */
var SCENARIOS=[
  ['ok','ok','ok','ok'],               /* 1 都正常 */
  ['ok','warn','ok','warn'],           /* 2 不穩：⚠ 不中斷，一路檢查到最後 */
  ['ok','fail','pending','pending'],   /* 3 有錯誤（Ping 異常）→ ❌ 停止 */
  ['ok','warn','fail','pending'],      /* 4 錯誤＋不穩 */
  ['ok','ok','dns','pending'],         /* 5 DNS 異常：Ping 都成功，但 Gateway 的 DNS 失敗 → ❌ 停止 */
  ['ok','warndns','pending','pending'],/* 6 Ping 不穩＋DNS 異常（Router） */
  ['ok','ok','faildns','pending']      /* 7 Ping 異常＋DNS 異常（Gateway） */
];
var ENTRY_SCENARIO=2;                  /* 首頁「詳細診斷」進來時用的情境（有錯誤） */
function sev(st){return (st==='fail'||st==='dns'||st==='warndns'||st==='faildns')?'fail':(st==='ok'||st==='warn'?st:st)}
function pend(){return STEPS.map(function(){return 'pending';})}
var statuses=pend();
var state='idle', busy=false, runCount=0, origin='list';

function statusIcon(st){
  st=sev(st);
  if(st==='ok')   return '<div class="sb" style="background:'+COLOR.ok+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
  if(st==='warn') return '<div class="sb" style="background:'+COLOR.warn+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="13.5"/><line x1="12" y1="18.4" x2="12.01" y2="18.4" stroke-width="4"/></svg></div>';
  if(st==='fail') return '<div class="sb" style="background:'+COLOR.fail+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></div>';
  if(st==='checking') return '<div class="spin"></div>';
  return '<span class="dash">--</span>';
}

function box(parts,tone){
  return '<div class="box'+(tone?' '+tone:'')+'">'+parts.map(function(fc){
    return '<div class="part"><b>'+fc.title+'</b>'+fc.lines.map(function(l){return '<span>'+(fc.lines.length>1?'• ':'')+l+'</span>';}).join('')+'</div>';
  }).join('')+'</div>';
}
function renderSteps(){
  var clickable=(state==='warn'||state==='fail');
  g('steps').innerHTML=STEPS.map(function(s,i){
    var st=statuses[i], extra='';
    var pf=(st==='fail'||st==='faildns'), df=(st==='dns'||st==='warndns'||st==='faildns');
    var tone=(pf||df)?'':'warn';             /* any error → every callout in the row is red; ping-unstable alone → yellow */
    var parts=[];                            /* one callout per layer; several messages share it, in order Ping then DNS */
    if(st==='warn'||st==='warndns') parts.push(WARN_COPY);
    if(pf) parts.push(PING_FAIL[s.key]);
    if(df) parts.push(DNS_FAIL[s.key]);
    if(parts.length) extra=box(parts,tone);
    return '<div class="row"'+(clickable?' onclick="cycleStep('+i+')" style="cursor:pointer"':'')+'>'
      +(i<STEPS.length-1?'<div class="line"></div>':'')
      +'<div class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+s.icon+'</svg></div>'
      +'<div class="main"><div class="top"><span class="lbl">'+s.label+'</span>'+statusIcon(st)+'</div>'+extra+'</div>'
      +'</div>';
  }).join('');
}

function renderHero(st,o){
  state=st;
  var t=THEME[st];
  g('hero').style.background='radial-gradient(ellipse 125% 100% at 50% 0%,'+t.c[0]+' 0%,'+t.c[1]+' 42%,'+t.c[2]+' 78%,rgba(255,255,255,0) 100%)';
  g('hicon').innerHTML=st==='success'?ICON.ok:st==='warn'?ICON.warn:st==='fail'?ICON.fail:ICON.search;
  g('htitle').textContent=o.title;
  g('hsub').textContent=o.sub;
  var b=g('hbtn');
  b.textContent=o.btn;
  b.style.color=t.btn;
  b.style.opacity=o.disabled?'.55':'1';
  b.style.pointerEvents=o.disabled?'none':'';
}

/* hero state follows the worst status present: fail > warn > success */
function applyStatuses(){
  if(statuses.some(function(x){return sev(x)==='fail';}))
    renderHero('fail',{title:'網路連線異常',sub:'請依下方步驟排除問題後，再重新診斷',btn:'重新診斷'});
  else if(statuses.some(function(x){return x==='warn';}))
    renderHero('warn',{title:'網路連線不穩定',sub:'目前仍可連線，但部分檢測顯示可能影響上網體驗',btn:'重新診斷'});
  else
    renderHero('success',{title:'網路連線正常',sub:'網路連線正常運作中，好好享受網際網路吧',btn:'重新診斷'});
  renderSteps();
}

function setIdle(){
  busy=false;runToken++;
  statuses=pend();
  renderHero('idle',{title:'診斷您的網路連線',sub:'從您的裝置開始，依序檢查各項連線',btn:'開始'});
  renderSteps();
}

/* Timing per issue #2549 (顯示順序不代表實際執行順序):
   0–4s   Client spins; background runs the Internet quick check + every layer's 3s ping together
   4s     Client result, Router spins
   then   every 1s: reveal the next layer's result and spin the following one (Router → Gateway → Internet)
   last   the Internet result + the page-level state (DNS is now part of each layer's result).
   A fully failed layer (❌) stops the chain: the page-level state shows as soon as that row is revealed. */
var PHASE1_MS=4000, REVEAL_MS=1000, runToken=0;
function runDiag(scn){
  if(busy) return;
  busy=true;
  var token=++runToken;
  var plan=(typeof scn==='number')?SCENARIOS[scn]:SCENARIOS[runCount%SCENARIOS.length];
  if(typeof scn!=='number') runCount++;
  statuses=pend();
  renderHero('running',{title:'診斷您的網路連線',sub:'診斷中，請稍候...',btn:'診斷中...',disabled:true});
  statuses[0]='checking';renderSteps();
  var i=0;
  function reveal(){
    if(token!==runToken) return;           /* left the page / restarted */
    statuses[i]=plan[i];
    if(sev(plan[i])==='fail'||i>=STEPS.length-1){busy=false;applyStatuses();return;}
    i++;statuses[i]='checking';renderSteps();
    setTimeout(reveal,REVEAL_MS);
  }
  setTimeout(reveal,PHASE1_MS);
}

/* demo: tap a row (only in warn/fail) to cycle that step ok→warn→fail→ok */
function normalize(){
  var f=statuses.findIndex(function(x){return sev(x)==='fail';});
  statuses=statuses.map(function(x,i){
    if(f>=0&&i>f) return 'pending';
    return x==='pending'?'ok':x;
  });
}
function cycleStep(i){
  if(busy) return;
  var order=['ok','warn','fail'];
  var nx=order[(order.indexOf(sev(statuses[i]))+1)%3];
  if(nx==='fail') statuses=statuses.map(function(x,k){return (k!==i&&sev(x)==='fail')?'ok':x;});
  statuses[i]=nx;
  normalize();
  applyStatuses();
}
function demoJump(kind){
  if(busy) return;
  statuses=kind==='success'?['ok','ok','ok','ok']
    :kind==='fail'?['ok','fail','pending','pending']
    :kind==='mixed'?['ok','warn','fail','pending']
    :kind==='dns'?['ok','ok','dns','pending']
    :kind==='warndns'?['ok','warndns','pending','pending']
    :kind==='faildns'?['ok','ok','faildns','pending']
    :['ok','warn','ok','ok'];
  applyStatuses();
}

/* navigation */
function openDiag(from,autorun){
  origin=from;
  setIdle();
  gotoPage('pg-diag');
  if(autorun) runDiag(ENTRY_SCENARIO);   /* 詳細診斷 from the abnormal bar → straight into 診斷中 */
}
function backFromDiag(){
  setIdle();
  gotoPage(origin==='traffic'?'pg-traffic':'pg-list');
}
setIdle();
</script>
