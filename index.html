<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#56B7FF">
<title>Network Diagnostic</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F4F6FB;--w:#fff;--s2:#F0F2F8;
  --bd:#E4E8F2;--bd2:#CDD3E8;
  --tx:#0C1120;--t2:#46526E;--t3:#8A93AA;
  --ac:#4A8FE0;
  --r:16px;--r2:12px;
  --f:'DM Sans',sans-serif;
  --sh:0 2px 16px rgba(0,0,0,.06);
}
html,body{width:100%;height:100%;overflow:hidden;background:#D8DCE8;font-family:var(--f)}
body{display:flex;align-items:center;justify-content:center}
.phone{width:393px;height:852px;max-height:100%;background:var(--w);overflow:hidden;position:relative;display:flex;flex-direction:column;flex-shrink:0}
@media (max-width:430px){.phone{width:100%;height:100dvh;max-height:none}}
.sub{display:none;position:absolute;inset:0;z-index:10;flex-direction:column;background:var(--bg)}
.sub.on{display:flex}
.ov{display:none;position:absolute;inset:0;z-index:20;background:rgba(12,17,32,.5);align-items:flex-end}
.ov.on{display:flex}
.sheet{background:var(--w);border-radius:24px 24px 0 0;width:100%;padding:20px 20px 48px;max-height:86%;overflow-y:auto}
.hdl{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="phone">
  <div class="sub on" id="sub-diag">
    <!-- full-bleed header: nav + hero merged into one colored block -->
    <div id="diag-hero" style="background:linear-gradient(140deg,#90BFF5,#4D95EA,#3B87E0);flex-shrink:0;transition:background .5s ease">
      <div style="display:flex;align-items:center;gap:12px;padding:24px 20px 24px">
        <div id="diag-back" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
        <div style="font-size:17px;font-weight:600;color:#fff">Network Diagnostic</div>
      </div>
      <div style="padding:16px 24px 56px">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:28px">
          <div id="diag-hero-icon" style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0"></div>
          <div style="flex:1;min-width:0;text-align:left">
            <div id="diag-hero-title" style="font-size:18px;font-weight:700;color:#fff;margin-bottom:4px">診斷您的網路連線</div>
            <div id="diag-hero-sub" style="font-size:13px;color:rgba(255,255,255,.88);line-height:1.5">從您的裝置開始，依序檢查各項連線</div>
          </div>
        </div>
        <div id="diag-hero-btn" style="width:100%;height:48px;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;cursor:pointer;color:var(--ac);box-shadow:0 4px 14px rgba(0,0,0,.12)">開始</div>
      </div>
    </div>

    <!-- scrollable body -->
    <div style="flex:1;min-height:0;overflow-y:auto;background:var(--bg)">

      <!-- Network Diagnostic: connection-chain steps -->
      <div id="diag-main">
        <div style="padding:20px 20px 32px">
          <div onclick="show('ov-diag-demo')" style="font-size:13px;font-weight:600;color:var(--t3);margin-bottom:12px;cursor:pointer">連線檢查</div>
          <div id="diag-steps"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Demo picker: hidden trigger, tap "連線檢查" label to open -->
  <div class="ov" id="ov-diag-demo" onclick="if(event.target===this)hide('ov-diag-demo')">
    <div class="sheet">
      <div class="hdl"></div>
      <div style="font-size:18px;font-weight:600;color:var(--tx);text-align:center;margin-bottom:4px">切換診斷情境</div>
      <div style="font-size:13px;color:var(--t3);text-align:center;margin-bottom:18px">Demo 用，選擇要展示的畫面</div>
      <div onclick="hide('ov-diag-demo');netDiagDemoJump('success')" style="display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer">
        <div style="width:34px;height:34px;border-radius:50%;background:#3DBBAF;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div style="font-size:16px;font-weight:600;color:var(--tx)">都正常</div>
      </div>
      <div onclick="hide('ov-diag-demo');netDiagDemoJump('fail')" style="display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer">
        <div style="width:34px;height:34px;border-radius:50%;background:#D95B47;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></div>
        <div style="font-size:16px;font-weight:600;color:var(--tx)">有錯誤 ✕</div>
      </div>
      <div onclick="hide('ov-diag-demo');netDiagDemoJump('mixed')" style="display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer">
        <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FF9643 50%,#D95B47 50%);display:flex;align-items:center;justify-content:center;flex-shrink:0"></div>
        <div style="font-size:16px;font-weight:600;color:var(--tx)">錯誤＋不穩</div>
      </div>
      <div onclick="hide('ov-diag-demo');netDiagDemoJump('warn')" style="display:flex;align-items:center;gap:12px;padding:14px 4px;cursor:pointer">
        <div style="width:34px;height:34px;border-radius:50%;background:#FF9643;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="12" y1="7" x2="12" y2="13"/><line x1="12" y1="16.8" x2="12.01" y2="16.8" stroke-width="3.6"/></svg></div>
        <div style="font-size:16px;font-weight:600;color:var(--tx)">不穩 ！</div>
      </div>
    </div>
  </div>
</div>
<script>
function g(id){return document.getElementById(id)}
function show(id){var e=g(id);if(e)e.classList.add('on')}
function hide(id){var e=g(id);if(e)e.classList.remove('on')}
function bind(id,fn){var e=g(id);if(e)e.addEventListener('click',fn)}
(function(){
  // ── Network Diagnostic: connection-chain flow (裝置 → 路由器 → 數據機 → 網際網路) ──
  var NET_DIAG_STEPS=[
    {key:'device',   label:'您的裝置'},
    {key:'router',   label:'華碩路由器'},
    {key:'modem',    label:'數據機'},
    {key:'internet', label:'網際網路'}
  ];
  // Copy per NETWORK_DIAGNOSTIC_TYPE (failure categories reference table + Figma)
  var NET_DIAG_FAILS={
    device_wifi:{step:'device',  heroTitle:'無法連上您的裝置',   title:'無線網路已關閉',                  desc:'請開啟您裝置的無線網路'},
    device_net: {step:'device',  heroTitle:'無法連上您的裝置',   title:'請啟用您行動裝置的無線網路',        desc:'請確認您的華碩路由器是開啟的狀態、且您的裝置連線到正確的無線網路'},
    router:     {step:'router',  heroTitle:'無法連上華碩路由器', title:'華碩路由器似乎是離線狀態',          desc:'請確認您的華碩路由器是開啟的狀態、且您的裝置連線到正確的無線網路'},
    modem:      {step:'modem',   heroTitle:'數據機連線異常',     title:'請檢查數據機電源與線路',            desc:'請確認數據機已開機，且與華碩路由器之間的網路線已正確連接'},
    internet:   {step:'internet',heroTitle:'無法連上網際網路',   title:'您的網路服務供應商似乎出了點問題',   desc:'請與您的網路服務供應商聯繫，以修正網路連線問題'}
  };
  var NET_DIAG_WARN_DESC='此段連線不穩定，可能影響上網體驗';
  var NET_DIAG_GRADIENT={
    idle:   'linear-gradient(180deg,#56B7FF 0%,#7CC6FF 38%,#C7E7FF 72%,#F4F6FB 100%)',
    running:'linear-gradient(180deg,#56B7FF 0%,#7CC6FF 38%,#C7E7FF 72%,#F4F6FB 100%)',
    success:'linear-gradient(180deg,#3DBBAF 0%,#6BCCC4 38%,#C3EAE6 72%,#F4F6FB 100%)',
    warn:   'linear-gradient(180deg,#FAAD68 0%,#FBC08C 38%,#FDE4C9 72%,#F4F6FB 100%)',
    fail:   'linear-gradient(180deg,#E37B69 0%,#EB9C8E 38%,#F6D2CB 72%,#F4F6FB 100%)'
  };
  var NET_DIAG_OK_COLOR='#3DBBAF';
  var NET_DIAG_WARN_COLOR='#FF9643';
  var NET_DIAG_FAIL_COLOR='#D95B47';
  var _netDiagRun=0;
  var _netDiagBusy=false;
  var _netDiagState='idle';
  var _netDiagStatuses=['pending','pending','pending','pending'];
  var NET_DIAG_FAIL_KEY_BY_STEP={device:'device_wifi',router:'router',modem:'modem',internet:'internet'};

  function netDiagIcon(kind){
    if(kind==='ok') return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    if(kind==='warn') return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="14"/><line x1="12" y1="17.6" x2="12.01" y2="17.6" stroke-width="4.4"/></svg>';
    if(kind==='fail') return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
    return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>';
  }

  function renderNetDiagSteps(statuses, failInfo){
    var rows=NET_DIAG_STEPS.map(function(step,i){
      var st=statuses[i], circle, statusHtml;
      var pendingCircle='<div style="position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:#DFE1E6;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:var(--t2)">'+(i+1)+'</div>';
      if(st==='ok'){
        circle='<div style="position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:'+NET_DIAG_OK_COLOR+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
        statusHtml='<span style="font-size:13px;font-weight:500;color:'+NET_DIAG_OK_COLOR+'">正常</span>';
      } else if(st==='warn'){
        circle='<div style="position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:'+NET_DIAG_WARN_COLOR+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="12" y1="7" x2="12" y2="13"/><line x1="12" y1="16.8" x2="12.01" y2="16.8" stroke-width="3.6"/></svg></div>';
        statusHtml='<span style="font-size:13px;font-weight:500;color:'+NET_DIAG_WARN_COLOR+'">連線不穩</span>';
      } else if(st==='fail'){
        circle='<div style="position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:'+NET_DIAG_FAIL_COLOR+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><line x1="7" y1="7" x2="17" y2="17"/><line x1="17" y1="7" x2="7" y2="17"/></svg></div>';
        statusHtml='<span style="font-size:13px;font-weight:500;color:'+NET_DIAG_FAIL_COLOR+'">連線異常</span>';
      } else if(st==='checking'){
        circle=pendingCircle;
        statusHtml='<div style="width:16px;height:16px;border-radius:50%;border:2px solid var(--bd2);border-top-color:var(--t3);animation:spin .7s linear infinite"></div>';
      } else {
        circle=pendingCircle;
        statusHtml='<span style="font-size:13px;font-weight:500;color:var(--t3)">未檢查</span>';
      }
      var clickable=_netDiagState==='fail'||_netDiagState==='warn';
      var row='<div'+(clickable?' onclick="cycleNetDiagStep('+i+')"':'')+' style="position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:17px 16px'+(clickable?';cursor:pointer':'')+'">'
        +circle
        +'<div style="flex:1;font-size:16px;font-weight:600;color:var(--tx)">'+step.label+'</div>'
        +statusHtml
      +'</div>';
      if(st==='fail' && failInfo){
        row+='<div style="position:relative;z-index:1;margin:0 16px 14px 62px;background:#FDF1EF;border:1.5px solid '+NET_DIAG_FAIL_COLOR+';border-radius:var(--r2);padding:12px 14px">'
          +'<div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:4px">'+failInfo.title+'</div>'
          +'<div style="font-size:12.5px;color:var(--t2);line-height:1.6">'+failInfo.desc+'</div>'
        +'</div>';
      } else if(st==='warn'){
        row+='<div style="position:relative;z-index:1;margin:2px 16px 14px 62px;font-size:12.5px;color:var(--t3);line-height:1.6">'+NET_DIAG_WARN_DESC+'</div>';
      }
      return row;
    }).join('');
    var html='<div style="position:relative">'
      +'<div style="position:absolute;left:32px;top:33px;bottom:33px;width:2px;background:var(--bd);z-index:0"></div>'
      +rows
    +'</div>';
    var el=g('diag-steps'); if(el) el.innerHTML=html;
  }

  function renderNetDiagHero(state, opts){
    opts=opts||{};
    _netDiagState=state;
    var hero=g('diag-hero'), icon=g('diag-hero-icon'), title=g('diag-hero-title'), sub=g('diag-hero-sub'), btn=g('diag-hero-btn');
    if(!hero) return;
    hero.style.background=NET_DIAG_GRADIENT[state];
    var accent=state==='success'?NET_DIAG_OK_COLOR:state==='warn'?NET_DIAG_WARN_COLOR:state==='fail'?NET_DIAG_FAIL_COLOR:'var(--ac)';
    if(icon) icon.innerHTML=state==='success'?netDiagIcon('ok'):state==='warn'?netDiagIcon('warn'):state==='fail'?netDiagIcon('fail'):netDiagIcon('search');
    if(title) title.textContent=opts.title||'';
    if(sub) sub.innerHTML=opts.sub||'';
    if(btn){
      btn.textContent=opts.btnText||'';
      btn.style.color=accent;
      btn.style.opacity=opts.disabled?'.6':'1';
      btn.style.pointerEvents=opts.disabled?'none':'';
    }
  }

  function renderNetDiagIdle(){
    _netDiagBusy=false;
    _netDiagStatuses=['pending','pending','pending','pending'];
    renderNetDiagHero('idle',{title:'診斷您的網路連線',sub:'從您的裝置開始，依序檢查各項連線',btnText:'開始'});
    renderNetDiagSteps(_netDiagStatuses);
  }

  // Renders whatever _netDiagStatuses currently holds: fail wins (shows that step's
  // callout), otherwise any warn(s) show the unstable hero, otherwise success.
  function renderNetDiagFromStatuses(){
    var failIdx=_netDiagStatuses.indexOf('fail');
    var failInfo=failIdx>=0?NET_DIAG_FAILS[NET_DIAG_FAIL_KEY_BY_STEP[NET_DIAG_STEPS[failIdx].key]]:null;
    if(failInfo){
      renderNetDiagHero('fail',{title:failInfo.heroTitle,sub:'請依下方步驟排除，再重新診斷',btnText:'重新診斷'});
      renderNetDiagSteps(_netDiagStatuses, failInfo);
      return;
    }
    var warnCount=_netDiagStatuses.filter(function(s){return s==='warn';}).length;
    if(warnCount===0){
      renderNetDiagHero('success',{title:'網路連線正常',sub:'網路連線正常運作中，好好享受網際網路吧。',btnText:'重新診斷'});
      renderNetDiagSteps(_netDiagStatuses);
      return;
    }
    var warnLabel=warnCount===1
      ? NET_DIAG_STEPS[_netDiagStatuses.indexOf('warn')].label+'連線不穩'
      : '部分網路連線不穩定';
    renderNetDiagHero('warn',{title:warnLabel,sub:'部分連線不穩定，建議稍後重新診斷',btnText:'重新診斷'});
    renderNetDiagSteps(_netDiagStatuses);
  }

  // Demo helper: click any of the 4 steps to cycle its status 正常→連線不穩→連線異常→
  // 正常, mixing and matching freely (only one step can be 連線異常 at a time so the
  // callout copy stays unambiguous; 連線不穩 can apply to several steps at once).
  window.cycleNetDiagStep=function(index){
    if(_netDiagBusy) return;
    var order=['ok','warn','fail'];
    var next=order[(order.indexOf(_netDiagStatuses[index])+1)%3];
    if(next==='fail'){
      _netDiagStatuses=_netDiagStatuses.map(function(s,i){return (i!==index && s==='fail')?'ok':s;});
    }
    _netDiagStatuses[index]=next;
    renderNetDiagFromStatuses();
  };

  // Demo picker (hidden trigger on the 連線檢查 label): jump straight to one of the
  // 4 canned scenarios without replaying the check animation.
  window.netDiagDemoJump=function(kind){
    if(_netDiagBusy) return;
    if(kind==='success') _netDiagStatuses=['ok','ok','ok','ok'];
    else if(kind==='fail') _netDiagStatuses=['ok','fail','pending','pending'];
    else if(kind==='mixed') _netDiagStatuses=['ok','warn','fail','pending'];
    else _netDiagStatuses=['ok','warn','ok','ok'];
    renderNetDiagFromStatuses();
  };

  // Each step is simulated as 3 ping attempts: 3/3 ok → 正常 (continue), 1-2/3 ok →
  // 連線不穩 (warn, continue), 0/3 ok → 連線異常 (fail, stop). Demo cycles through 3
  // canned outcomes on repeated 開始/重新診斷 presses: success, a hard failure (router),
  // and a mixed run (router unstable, then modem fails and stops the chain).
  var NET_DIAG_DEMO_SCENARIOS=[
    {outcomes:['ok','ok','ok','ok']},
    {outcomes:['ok','fail','pending','pending']},
    {outcomes:['ok','warn','fail','pending']}
  ];

  function runNetDiag(){
    if(_netDiagBusy) return;
    _netDiagBusy=true;
    _netDiagRun++;
    var scenario=NET_DIAG_DEMO_SCENARIOS[(_netDiagRun-1)%NET_DIAG_DEMO_SCENARIOS.length];
    var statuses=_netDiagStatuses=['pending','pending','pending','pending'];
    renderNetDiagHero('running',{title:'診斷您的網路連線',sub:'診斷中，請稍候…',btnText:'診斷中…',disabled:true});
    renderNetDiagSteps(statuses);

    var i=0;
    function next(){
      if(i>=NET_DIAG_STEPS.length || scenario.outcomes[i]==='pending'){
        _netDiagBusy=false;
        renderNetDiagFromStatuses();
        return;
      }
      var outcome=scenario.outcomes[i];
      // Random per-step check time: usually quick, occasionally noticeably longer.
      var checkTime=180+Math.random()*1400;
      statuses[i]='checking';
      renderNetDiagSteps(statuses);
      setTimeout(function(){
        statuses[i]=outcome;
        if(outcome==='fail'){
          _netDiagBusy=false;
          renderNetDiagFromStatuses();
          return;
        }
        renderNetDiagSteps(statuses);
        i++; next();
      },checkTime);
    }
    next();
  }
  renderNetDiagIdle();
  bind('diag-back',function(){renderNetDiagIdle();});
  bind('diag-hero-btn',function(){runNetDiag();});
})();
</script>
</body>
</html>
